# Integracion continua de la API (AJ-06): analisis estatico, pruebas y cobertura
name: Pruebas API

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * *"   # todos los dias a las 11:00 UTC = 6:00 a. m. en Colombia
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestana Actions

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JHONRAMIROZAPATAPEREZ_AA5-EV01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JHONRAMIROZAPATAPEREZ_AA5-EV01/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analisis estatico (ESLint)
        run: npm run lint

      - name: Pruebas y cobertura (Mocha + c8)
        run: npm run coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: JHONRAMIROZAPATAPEREZ_AA5-EV01/coverage
